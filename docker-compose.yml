# Stock Postgres for development and for parity checks before deploying.
#
# The test suite does not need this: tests/integration/harness.ts runs Postgres
# in-process via PGlite. Use this when you want the real server — and point
# DATABASE_URL at it to run the same integration tests unchanged.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: familys_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d familys_management']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
